<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Crea tu Cuenta</h2>
      <p>Únete a la comunidad de servicios y oficios</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>¿Qué deseas hacer?</label>
        <select formControlName="role" class="form-control">
          <option value="CLIENT">Busco contratar un servicio (Cliente)</option>
          <option value="WORKER">Ofrezco mis servicios (Trabajador)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fullName">Nombre Completo</label>
        <input
          id="fullName"
          type="text"
          class="form-control"
          formControlName="fullName"
          placeholder="Juan Pérez">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="tu@correo.com">
      </div>

      <div class="form-group">
        <label for="phone">Teléfono / WhatsApp</label>
        <input
          id="phone"
          type="tel"
          class="form-control"
          formControlName="phone"
          placeholder="Ej. +52 123 456 7890">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Mínimo 6 caracteres">
      </div>

      @if (isWorker()) {
        <div class="worker-box">
          <h4> Información Profesional</h4>

          <div class="form-group">
            <label for="trade">Oficio Principal</label>
            <input
              id="trade"
              type="text"
              class="form-control"
              formControlName="trade"
              placeholder="Ej. Albañil, Plomero, Carpintero">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="location">Zona de Cobertura</label>
            <input
              id="location"
              type="text"
              class="form-control"
              formControlName="location"
              placeholder="Ej. San Luis Potosí / Zona Centro">
          </div>
        </div>
      }

      <button type="submit" [disabled]="registerForm.invalid" class="btn-submit">
        Completar Registro
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
