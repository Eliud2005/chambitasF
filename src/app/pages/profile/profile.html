<div class="min-h-screen bg-slate-50 py-8 px-4">
  <div class="max-w-2xl mx-auto space-y-6">

   
    <div class="bg-white rounded-xl shadow border border-slate-100 p-6">
      <h2 class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100">Mi Perfil</h2>

      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre</label>
            <input type="text" formControlName="nombre" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Apellido</label>
            <input type="text" formControlName="apellido" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
            <input type="email" formControlName="email" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50" readonly>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono</label>
            <input type="tel" formControlName="telefono" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        @if (isTrabajador) {
          <div class="pt-4 border-t border-slate-100 space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Zona de Cobertura</label>
              <input type="text" formControlName="zonaCobertura" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Presentación / Descripción</label>
              <textarea formControlName="descripcion" rows="3" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Experiencia laboral</label>
              <textarea formControlName="experiencia" rows="2" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
              <input type="checkbox" formControlName="disponible" id="disponibleCheck" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
              <label for="disponibleCheck" class="text-sm font-medium text-slate-700">Disponible para recibir trabajos</label>
            </div>
          </div>
        }

        <button type="submit" class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors shadow">
          Guardar Cambios
        </button>
      </form>
    </div>


    @if (isTrabajador) {
      <div class="bg-white rounded-xl shadow border border-slate-100 p-6">
        <h3 class="text-lg font-bold text-slate-800">Oficios Principales</h3>
        <p class="text-xs text-slate-500 mb-4">Selecciona hasta 3 oficios a los que te dedicas (Regla RN-03)[cite: 1].</p>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
          @for (oficio of availableOficios; track oficio.id) {
            <button
              type="button"
              (click)="toggleOficio(oficio.id)"
              [class.bg-blue-600]="isSelected(oficio.id)"
              [class.text-white]="isSelected(oficio.id)"
              [class.border-blue-600]="isSelected(oficio.id)"
              [class.bg-slate-50]="!isSelected(oficio.id)"
              [class.text-slate-700]="!isSelected(oficio.id)"
              [class.border-slate-200]="!isSelected(oficio.id)"
              class="p-3 text-xs sm:text-sm font-semibold border rounded-lg transition-all text-center flex items-center justify-center gap-1.5 hover:border-blue-500">
              @if (isSelected(oficio.id)) { ✓ }
              {{ oficio.nombre }}
            </button>
          }
        </div>

        <button
          (click)="saveOficios()"
          [disabled]="selectedOficios.length === 0"
          class="w-full sm:w-auto px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-sm font-semibold rounded-lg transition-colors shadow">
          Guardar Oficios ({{ selectedOficios.length }}/3)
        </button>
      </div>
    }

  </div>
</div>
