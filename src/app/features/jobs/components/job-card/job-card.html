<div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm hover:shadow-md transition-shadow duration-200 mb-4">
  <!-- Encabezado de la tarjeta -->
  <div class="flex items-center justify-between mb-3">
    <span class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full capitalize">
      {{ job().oficioNombre || job().oficio?.nombre || 'General' }}
    </span>
    <span class="text-xs text-gray-500 font-medium">
      📍 {{ job().ubicacion }}
    </span>
  </div>

  <!-- Contenido -->
  <h3 class="text-lg font-bold text-gray-900 mb-2 leading-snug">
    {{ job().titulo }}
  </h3>

  <p class="text-sm text-gray-600 line-clamp-3 mb-4">
    {{ job().descripcion }}
  </p>

  <!-- Footer y Botón de Acción -->
  <div class="flex items-center justify-between border-t border-gray-100 pt-3 mt-auto">
    <div>
      @if (job().presupuesto) {
        <span class="text-xs text-gray-400 block">Presupuesto</span>
        <span class="text-base font-extrabold text-emerald-600">
          ${{ job().presupuesto }} MXN
        </span>
      } @else {
        <span class="text-xs text-gray-400 block">Presupuesto</span>
        <span class="text-sm font-semibold text-gray-600">A convenir</span>
      }
    </div>

    <button 
      (click)="contactWhatsApp()" 
      class="inline-flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-medium text-sm px-4 py-2.5 rounded-lg transition-all shadow-sm cursor-pointer">
      <span>Contactar por WhatsApp</span>
    </button>
  </div>
</div>
