<header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
    
    <!-- Branding / Logo -->
    <a routerLink="/jobs" class="flex items-center gap-2.5 group cursor-pointer shrink-0">
      <div class="w-9 h-9 bg-slate-900 text-white font-black text-lg rounded-xl flex items-center justify-center shadow-xs group-hover:bg-blue-600 transition-colors">
        O
      </div>
      <div class="flex flex-col">
        <span class="text-base font-extrabold text-slate-900 tracking-tight leading-tight group-hover:text-blue-600 transition-colors">
          Chambitas
        </span>
        <span class="text-[10px] font-bold text-slate-400 tracking-wider uppercase leading-none">
          Oaxaca
        </span>
      </div>
    </a>

    <!-- Navegación y Botones de Acción -->
    <div class="flex items-center gap-1.5 sm:gap-3">
      
      <!-- Enlaces del menú -->
      <a 
        routerLink="/directorio" 
        routerLinkActive="text-blue-600 bg-blue-50/80 font-bold"
        class="text-slate-600 hover:text-slate-900 text-xs font-bold px-3 py-2 rounded-xl hover:bg-slate-100/80 transition-all">
        Profesionales
      </a>
      
      <a 
        routerLink="/jobs" 
        routerLinkActive="text-blue-600 bg-blue-50/80 font-bold"
        class="text-slate-600 hover:text-slate-900 text-xs font-bold px-3 py-2 rounded-xl hover:bg-slate-100/80 transition-all">
        Empleos
      </a>

      <!-- Botón Publicar Empleo -->
      <a 
        routerLink="/registro-empleo" 
        class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-xs font-bold px-3.5 py-2 rounded-xl transition-all shadow-xs flex items-center gap-1.5 ml-1">
        <span>📢</span>
        <span class="hidden sm:inline">Publicar Empleo</span>
      </a>

      <!-- ESTADO DE SESIÓN -->
      @if (currentUser) {
        <div class="flex items-center gap-1 pl-2 border-l border-slate-200/80 ml-1">
          <!-- Perfil del usuario -->
          <a 
            routerLink="/profile" 
            class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200/80 text-slate-800 text-xs font-bold px-2.5 py-1.5 rounded-xl transition-all border border-slate-200/60">
            
            @if (currentUser.avatar) {
              <img [src]="currentUser.avatar" alt="Avatar" class="w-5 h-5 rounded-lg object-cover">
            } @else {
              <div class="w-5 h-5 rounded-lg bg-slate-900 text-white flex items-center justify-center font-black text-[10px] uppercase">
                {{ currentUser.nombre ? currentUser.nombre[0] : 'U' }}
              </div>
            }

            <span class="max-w-[90px] truncate hidden sm:inline">{{ currentUser.nombre }}</span>
          </a>

          <!-- Botón Cerrar Sesión -->
          <button 
            (click)="logout()" 
            title="Cerrar sesión"
            class="text-slate-400 hover:text-rose-600 p-2 rounded-xl hover:bg-rose-50 transition-colors cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
      } @else {
        <!-- Botón Ingresar -->
        <a 
          routerLink="/login" 
          class="text-slate-700 hover:text-blue-600 text-xs font-bold px-3.5 py-2 rounded-xl border border-slate-200 hover:border-blue-200 hover:bg-blue-50/50 transition-all ml-1">
          Ingresar
        </a>
      }

    </div>

  </div>
</header>
