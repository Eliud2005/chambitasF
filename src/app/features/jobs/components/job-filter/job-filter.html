<div class="mb-6 rounded-2xl border border-gray-100 bg-white p-5 shadow-xl shadow-gray-100">
  
  <!-- Barra de Búsqueda + Selector de Ubicación -->
  <div class="mb-4 grid grid-cols-1 gap-3 md:grid-cols-3">
    
    <!-- Input Búsqueda (2 columnas en Desktop) -->
    <div class="relative md:col-span-2">
      <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <input
        type="text"
        placeholder="Buscar por nombre o palabra clave..."
        (input)="onSearchChange($event)"
        class="w-full rounded-xl border border-gray-200 bg-gray-50/50 py-3 pl-10 pr-4 text-sm text-gray-900 placeholder:text-gray-400 transition-all focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
      />
    </div>

    <!-- Select de Ubicación (1 columna) -->
    <div class="relative">
      <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      
      <select
        [value]="selectedLocation()"
        (change)="onLocationChange($event)"
        class="w-full cursor-pointer appearance-none rounded-xl border border-gray-200 bg-gray-50/50 py-3 pl-10 pr-9 text-sm text-gray-900 transition-all focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
      >
        <option value="">Todas las zonas</option>
        @for (loc of locations; track loc) {
          <option [value]="loc">{{ loc }}</option>
        }
      </select>

      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[10px] text-gray-400">
        ▼
      </div>
    </div>

  </div>

  <!-- Filtro por Oficios (Badges/Chips horizontales) -->
  <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
    
    <!-- Opción Todos -->
    <button
      type="button"
      (click)="selectCategory('')"
      [class]="selectedCategory() === '' 
        ? 'bg-emerald-500 text-white font-medium shadow-sm shadow-emerald-500/10' 
        : 'bg-gray-100/80 text-gray-600 hover:bg-gray-200/80 font-normal'"
      class="whitespace-nowrap rounded-full px-4 py-2 text-xs transition-all cursor-pointer"
    >
      Todas
    </button>

    <!-- Lista Dinámica de Oficios desde NestJS -->
    @for (oficio of oficios(); track oficio.id) {
      <button
        type="button"
        (click)="selectCategory(oficio.id)"
        [class]="selectedCategory() === oficio.id 
          ? 'bg-emerald-500 text-white font-medium shadow-sm shadow-emerald-500/10' 
          : 'bg-gray-100/80 text-gray-600 hover:bg-gray-200/80 font-normal'"
        class="whitespace-nowrap rounded-full px-4 py-2 text-xs transition-all cursor-pointer"
      >
        {{ oficio.nombre }}
      </button>
    }

  </div>

</div>
