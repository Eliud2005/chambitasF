<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-slate-100 p-6 sm:p-8">

    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">¡Hola de nuevo!</h2>
      <p class="text-xs text-slate-500 mt-1">Ingresa tus datos para acceder a tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="tu@correo.com">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••">
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-sm font-semibold rounded-lg transition-colors shadow mt-2">
        Iniciar Sesión
      </button>
    </form>

    <div class="text-center mt-6 pt-4 border-t border-slate-100">
      <p class="text-xs text-slate-600">
        ¿Aún no tienes cuenta?
        <a routerLink="/register" class="font-semibold text-blue-600 hover:text-blue-700">Regístrate gratis</a>
      </p>
    </div>

  </div>
</div>
