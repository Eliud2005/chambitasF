<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-slate-100 p-6 sm:p-8">
    <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">Crear Cuenta</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre</label>
          <input type="text" formControlName="nombre" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. Dhayan">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Apellido</label>
          <input type="text" formControlName="apellido" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. Martínez">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
        <input type="email" formControlName="email" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="correo@ejemplo.com">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono</label>
        <input type="tel" formControlName="telefono" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="4441234567">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo de Usuario</label>
        <select formControlName="rol" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          <option value="CLIENTE">Cliente (Busco servicios)</option>
          <option value="TRABAJADOR">Trabajador (Ofrezco servicios)</option>
        </select>
      </div>

      <!-- Campos Exclusivos de Trabajador -->
      @if (isWorker()) {
        <div class="space-y-4 pt-2 border-t border-slate-100">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Zona de Cobertura</label>
            <input type="text" formControlName="zonaCobertura" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. San Luis Potosí - Zona Centro">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción Breve / Servicios</label>
            <textarea formControlName="descripcion" rows="2" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Resumen de tus especialidades"></textarea>
          </div>
        </div>
      }

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
        <input type="password" formControlName="password" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-sm font-semibold rounded-lg transition-colors shadow">
        Registrarse
      </button>
    </form>
  </div>
</div>
