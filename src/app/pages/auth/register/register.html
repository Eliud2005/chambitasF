<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Crea tu Cuenta</h2>
      <p>Únete a la comunidad de servicios y oficios</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- Selector de Rol -->
      <div class="form-group">
        <label>¿Qué deseas hacer?</label>
        <select formControlName="rol" class="form-control">
          <option value="CLIENTE">Busco contratar un servicio (Cliente)</option>
          <option value="TRABAJADOR">Ofrezco mis servicios (Trabajador)</option>
        </select>
      </div>

      <!-- Nombre y Apellido divididos para MySQL -->
      <div class="form-row" style="display: flex; gap: 1rem;">
        <div class="form-group" style="flex: 1;">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" class="form-control" formControlName="nombre" placeholder="Juan">
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" class="form-control" formControlName="apellido" placeholder="Pérez">
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" class="form-control" formControlName="email" placeholder="tu@correo.com">
      </div>

      <!-- Teléfono (10 dígitos) -->
      <div class="form-group">
        <label for="telefono">Teléfono Celular</label>
        <input id="telefono" type="tel" class="form-control" formControlName="telefono" placeholder="4441234567">
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="form-control" formControlName="password" placeholder="Mínimo 6 caracteres">
      </div>

      <!-- Campos opcionales para Trabajador -->
      @if (isWorker()) {
        <div class="worker-box">
          <h4>Perfil Profesional</h4>

          <div class="form-group">
            <label for="zonaCobertura">Zona de Cobertura</label>
            <input
              id="zonaCobertura"
              type="text"
              class="form-control"
              formControlName="zonaCobertura"
              placeholder="Ej. San Luis Potosí / Zona Centro">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="descripcion">Presentación / Breve Descripción</label>
            <textarea
              id="descripcion"
              class="form-control"
              formControlName="descripcion"
              rows="2"
              placeholder="Escribe brevemente tu experiencia u oficios que realizas..."></textarea>
          </div>
        </div>
      }

      <button type="submit" [disabled]="registerForm.invalid" class="btn-submit">
        Completar Registro
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
