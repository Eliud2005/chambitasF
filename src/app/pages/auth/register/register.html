<div class="min-h-[85vh] flex items-center justify-center py-8 px-4">
  <div class="w-full max-w-xl bg-white rounded-2xl border border-slate-200/80 shadow-md p-6 sm:p-8 space-y-6 relative overflow-hidden">
    
    <!-- Acento Superior de Marca -->
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-blue-600"></div>

    <!-- Encabezado con Identidad -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-slate-900 text-white font-black text-2xl rounded-xl shadow-sm mb-1 tracking-tight">
        O
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Crea tu cuenta</h2>
      <p class="text-xs text-slate-500 leading-relaxed">Únete a OaxacaEmpleos para contratar o prestar servicios locales</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Nombre y Apellido -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-800">Nombre</label>
          <input 
            type="text" 
            formControlName="nombre" 
            placeholder="Ej. Dhayan"
            class="w-full px-3.5 py-2.5 text-xs text-slate-900 bg-white border border-slate-200 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none transition-all placeholder:text-slate-400">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-800">Apellido</label>
          <input 
            type="text" 
            formControlName="apellido" 
            placeholder="Ej. Martínez"
            class="w-full px-3.5 py-2.5 text-xs text-slate-900 bg-white border border-slate-200 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none transition-all placeholder:text-slate-400">
        </div>
      </div>

      <!-- Correo Electrónico -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-800">Correo Electrónico</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </div>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="correo@ejemplo.com"
            class="w-full pl-10 pr-4 py-2.5 text-xs text-slate-900 bg-white border border-slate-200 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none transition-all placeholder:text-slate-400">
        </div>
      </div>

      <!-- Teléfono y Tipo de Usuario -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-800">Teléfono (WhatsApp)</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
            </div>
            <input 
              type="tel" 
              formControlName="telefono" 
              placeholder="951 123 4567"
              class="w-full pl-10 pr-4 py-2.5 text-xs text-slate-900 bg-white border border-slate-200 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none transition-all placeholder:text-slate-400">
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-800">Tipo de Usuario</label>
          <select 
            formControlName="rol" 
            class="w-full px-3.5 py-2.5 text-xs text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none transition-all cursor-pointer font-medium">
            <option value="CLIENTE">Cliente (Busco servicios)</option>
            <option value="TRABAJADOR">Trabajador (Ofrezco servicios)</option>
          </select>
        </div>
      </div>

      <!-- Sección Condicional: Campos de Trabajador -->
      @if (isWorker()) {
        <div class="space-y-4 pt-4 border-t border-slate-100 bg-blue-50/40 -mx-6 sm:-mx-8 px-6 sm:px-8 py-4 my-2">
          <div class="flex items-center gap-2 mb-1">
            <span class="inline-flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-blue-700 bg-blue-100/80 px-2.5 py-0.5 rounded-md">
              Perfil Profesional
            </span>
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-800">Zona de Cobertura</label>
            <input 
              type="text" 
              formControlName="zonaCobertura" 
              placeholder="Ej. Ocotlán de Morelos y Valles Centrales"
              class="w-full px-3.5 py-2.5 text-xs text-slate-900 bg-white border border-slate-200 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none transition-all placeholder:text-slate-400">
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-800">Descripción / Servicios Ofrecidos</label>
            <textarea 
              formControlName="descripcion" 
              rows="2" 
              placeholder="Resumen claro de tus especialidades, años de experiencia u oficios..."
              class="w-full px-3.5 py-2.5 text-xs text-slate-900 bg-white border border-slate-200 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none transition-all placeholder:text-slate-400 resize-none"></textarea>
          </div>
        </div>
      }

      <!-- Contraseña -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-800">Contraseña</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <input 
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
            class="w-full pl-10 pr-4 py-2.5 text-xs text-slate-900 bg-white border border-slate-200 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none transition-all placeholder:text-slate-400">
        </div>
      </div>

      <!-- Botón Registrarse -->
      <button 
        type="submit" 
        [disabled]="registerForm.invalid" 
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed active:scale-[0.98] text-white font-bold rounded-xl text-xs shadow-sm transition-all flex items-center justify-center gap-2 mt-4">
        <span>Crear mi Cuenta</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

    </form>

    <!-- Footer -->
    <div class="text-center pt-4 border-t border-slate-100">
      <p class="text-xs text-slate-500">
        ¿Ya tienes una cuenta registrada? 
        <a routerLink="/login" class="text-blue-600 font-bold hover:text-blue-700 hover:underline transition-colors">Inicia sesión</a>
      </p>
    </div>

  </div>
</div>
