<div class="bg-white rounded-xl border border-gray-200 p-5 shadow-xs hover:shadow-md transition-all duration-200 mb-4 flex flex-col justify-between">
  <div>
    <!-- Encabezado de la tarjeta -->
    <div class="flex items-center justify-between mb-3">
      <span class="inline-block bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-emerald-100/50 capitalize tracking-wide">
        {{ job().oficioNombre || job().oficio?.nombre || 'General' }}
      </span>
      <span class="text-xs text-gray-500 font-medium">
        📍 {{ job().ubicacion }}
      </span>
    </div>

    <!-- Contenido -->
    <h3 class="text-base font-bold text-gray-900 mb-2 leading-snug">
      {{ job().titulo }}
    </h3>

    <p class="text-sm text-gray-600 line-clamp-3 mb-4 leading-relaxed">
      {{ job().descripcion }}
    </p>
  </div>

  <!-- Footer y Botón de Acción -->
  <div class="flex items-center justify-between border-t border-gray-100 pt-3 mt-auto">
    <div>
      @if (job().presupuesto) {
        <span class="text-[11px] text-gray-400 font-medium uppercase tracking-wider block">Presupuesto</span>
        <span class="text-base font-extrabold text-gray-900">
          ${{ job().presupuesto }} <span class="text-xs font-normal text-gray-500">MXN</span>
        </span>
      } @else {
        <span class="text-[11px] text-gray-400 font-medium uppercase tracking-wider block">Presupuesto</span>
        <span class="text-sm font-semibold text-emerald-600">A convenir</span>
      }
    </div>

    <button 
      (click)="contactWhatsApp()" 
      class="inline-flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#20ba5a] active:scale-95 text-white font-medium text-sm px-4 py-2.5 rounded-lg transition-all shadow-sm cursor-pointer">
      <span>Contactar por WhatsApp</span>
    </button>
  </div>
</div>
