<section class="max-w-5xl mx-auto py-8 px-4 space-y-6">

  <!-- Componente de Filtro con Envoltorio Limpio -->
  <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-4 sm:p-5">
    <app-job-filter 
      (searchQuery)="onSearch($event)" 
      (categoryChange)="onCategoryFilter($event)" 
      (locationChange)="onLocationFilter($event)" 
    />
  </div>

  <!-- Encabezado de la Lista y Contador -->
  <div class="flex items-center justify-between px-1 pt-2">
    <div class="flex items-center gap-2">
      <h2 class="text-lg font-extrabold text-slate-900 tracking-tight">Ofertas Recientes</h2>
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
    </div>

    <span class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-700 bg-white border border-slate-200/80 px-3 py-1 rounded-full shadow-2xs">
      <span class="text-blue-600 font-black">{{ filteredJobs().length }}</span>
      <span>publicaciones</span>
    </span>
  </div>

  <!-- Grid Responsive de Tarjetas -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    @for (item of paginatedJobs(); track item.id) {
      <app-job-card [job]="item" />
    } @empty {
      <!-- Empty State -->
      <div class="col-span-full py-16 px-4 bg-white rounded-2xl border border-dashed border-slate-200 text-center space-y-3">
        <div class="w-12 h-12 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mx-auto border border-slate-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <div class="space-y-1">
          <h3 class="text-sm font-extrabold text-slate-900">No encontramos coincidencias</h3>
          <p class="text-xs text-slate-500 max-w-sm mx-auto">Intenta ajustar los filtros de búsqueda o la ubicación seleccionada.</p>
        </div>
      </div>
    }
  </div>

  <!-- Controles de Paginación -->
  @if (totalPages() > 1) {
    <div class="flex items-center justify-between pt-6 mt-8 border-t border-slate-200/80">
      
      <!-- Botón Anterior -->
      <button
        (click)="changePage(currentPage() - 1)"
        [disabled]="currentPage() === 1"
        class="px-4 py-2 text-xs font-bold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 hover:border-slate-300 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-slate-200 rounded-xl transition-all shadow-2xs flex items-center gap-1.5 cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        <span>Anterior</span>
      </button>

      <!-- Indicador de Página -->
      <div class="text-xs text-slate-500 font-medium bg-slate-100/80 px-3.5 py-1.5 rounded-xl border border-slate-200/60">
        Página <strong class="text-slate-900 font-black">{{ currentPage() }}</strong> de <strong class="text-slate-900 font-bold">{{ totalPages() }}</strong>
      </div>

      <!-- Botón Siguiente -->
      <button
        (click)="changePage(currentPage() + 1)"
        [disabled]="currentPage() === totalPages()"
        class="px-4 py-2 text-xs font-bold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 hover:border-slate-300 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-slate-200 rounded-xl transition-all shadow-2xs flex items-center gap-1.5 cursor-pointer">
        <span>Siguiente</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

    </div>
  }

</section>
